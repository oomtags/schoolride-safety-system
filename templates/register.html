<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สมัครสมาชิก — SchoolRide Intelligent Safety System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0b1220;
    --panel: #121b2e;
    --panel-border: #223252;
    --accent: #3b82f6;
    --accent-2: #22d3ee;
    --text: #e6edf7;
    --muted: #8ea0c0;
    --ok: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 0%, #16213d 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Segoe UI", "Sarabun", sans-serif;
    padding: 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 26px; text-align: center; }
  .brand .logo {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .brand h1 { font-size: 17px; margin: 0; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--panel-border); background: #0f1830; color: var(--text);
    font-size: 14px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }

  .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .sig-wrap { position: relative; }
  #sigPad {
    display: block; width: 100%; height: 150px; border-radius: 10px;
    border: 1px solid var(--panel-border); background: #ffffff; cursor: crosshair; touch-action: none;
  }
  .sig-clear-btn {
    position: absolute; top: 8px; right: 8px; margin: 0; width: auto;
    padding: 5px 12px; font-size: 11.5px; font-weight: 600;
    background: rgba(15,23,42,.75); color: #fff; border-radius: 8px;
  }
  .sig-clear-btn:hover { filter: brightness(1.15); background: rgba(15,23,42,.9); }
  .sig-error {
    font-size: 11.5px; color: #fca5a5; margin-top: 6px; display: none;
  }

  button {
    width: 100%; margin-top: 22px; padding: 12px;
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #04111f; font-weight: 700; font-size: 14.5px;
  }
  button:hover { filter: brightness(1.08); }

  .error-box {
    margin-top: 16px; padding: 10px 14px; border-radius: 10px;
    background: rgba(239,68,68,.14); border: 1px solid var(--danger); color: #fecaca;
    font-size: 13px;
  }
  .switch-link { margin-top: 20px; text-align: center; font-size: 13px; color: var(--muted); }
  .switch-link a { color: var(--accent-2); text-decoration: none; font-weight: 600; }
  .switch-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="logo">🚌</div>
      <h1>สมัครสมาชิก</h1>
      <p>SchoolRide Intelligent Safety System</p>
    </div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" id="registerForm">
      <label for="username">ชื่อผู้ใช้</label>
      <input type="text" id="username" name="username" value="{{ request.form.username or '' }}" required autofocus>

      <label for="email">อีเมล (Gmail)</label>
      <input type="email" id="email" name="email" value="{{ request.form.email or '' }}" placeholder="you@gmail.com" required>

      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" name="password" required>
      <div class="hint">อย่างน้อย 6 ตัวอักษร</div>

      <label for="confirm">ยืนยันรหัสผ่าน</label>
      <input type="password" id="confirm" name="confirm" required>

      <label for="sigPad">ลายเซ็น</label>
      <div class="sig-wrap">
        <canvas id="sigPad" width="360" height="150"></canvas>
        <button type="button" class="sig-clear-btn" id="sigClear">ล้างลายเซ็น</button>
      </div>
      <div class="hint">ใช้เมาส์หรือนิ้ว (มือถือ/แท็บเล็ต) เซ็นชื่อในกรอบสีขาวด้านบน</div>
      <div class="sig-error" id="sigError">กรุณาเซ็นชื่อก่อนสมัครสมาชิก</div>
      <input type="hidden" id="signature_data" name="signature_data">

      <button type="submit">สมัครสมาชิก</button>
    </form>

    <div class="switch-link">มีบัญชีอยู่แล้ว? <a href="{{ url_for('login') }}">เข้าสู่ระบบ</a></div>
  </div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById("sigPad");
  var ctx = canvas.getContext("2d");
  var hasDrawn = false;
  var drawing = false;
  var lastX = 0, lastY = 0;

  function clearCanvas() {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
  }
  clearCanvas();
  ctx.strokeStyle = "#111827";
  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    var t = e.touches && e.touches.length ? e.touches[0] : e;
    return {
      x: (t.clientX - rect.left) * (canvas.width / rect.width),
      y: (t.clientY - rect.top) * (canvas.height / rect.height)
    };
  }
  function start(e) {
    e.preventDefault();
    drawing = true;
    hasDrawn = true;
    var p = getPos(e);
    lastX = p.x; lastY = p.y;
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function end() { drawing = false; }

  canvas.addEventListener("mousedown", start);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);

  document.getElementById("sigClear").addEventListener("click", clearCanvas);

  document.getElementById("registerForm").addEventListener("submit", function (e) {
    var errEl = document.getElementById("sigError");
    if (!hasDrawn) {
      e.preventDefault();
      errEl.style.display = "block";
      canvas.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    errEl.style.display = "none";
    document.getElementById("signature_data").value = canvas.toDataURL("image/png");
  });
})();
</script>
</body>
</html>
